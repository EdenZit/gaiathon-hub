# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=100r/m;

# Rate limiting settings
limit_req_status 429;  # Too Many Requests
limit_req_log_level error;

# Burst settings
limit_req burst=20 nodelay zone=api_limit;
limit_req burst=50 nodelay zone=static_limit;

# IP whitelist for trusted sources
geo $limit {
    default 1;
    127.0.0.1 0;  # localhost
    10.0.0.0/8 0;  # internal network
    172.16.0.0/12 0;  # Docker network
    192.168.0.0/16 0;  # local network
}

# Map to apply rate limiting
map $limit $limit_key {
    0 "";
    1 $binary_remote_addr;
} 
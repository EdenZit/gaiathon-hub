version: '3.8'

services:
  test:
    build:
      context: .
      target: test
    command: tail -f /dev/null  # Keep container running
    environment:
      - NODE_ENV=test
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - redis
    tty: true
    stdin_open: true

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_test_data:/data

volumes:
  redis_test_data: 
tasks:
  database-consolidation:
    steps:
      - name: "Consolidate DB Connections"
        files:
          - src/lib/db/index.ts
          - src/lib/db/mongodb.ts
        rules:
          - "Database Connection"
          - "Type Safety"
        
  api-standardization:
    steps:
      - name: "Standardize API Routes"
        files:
          - src/app/api/user/profile/route.ts
          - src/app/api/team/**/*.ts
          - src/app/api/auth/**/*.ts
        rules:
          - "API Route Structure"
          - "Authentication Flow"
        
  model-verification:
    steps:
      - name: "Verify User Model"
        files:
          - src/lib/db/models/User.ts
          - src/lib/db/models/Team.ts
          - src/lib/db/models/Document.ts
        rules:
          - "Model Definition"
          - "Type Safety"

  workspace-features:
    steps:
      - name: "Team Workspace Components"
        files:
          - src/app/resources/team-workspace/**/*.tsx
          - src/components/team-workspace/**/*.tsx
        rules:
          - "Component Organization"
          - "Type Safety"
          - "Real-time Features" 